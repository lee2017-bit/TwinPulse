name: Feature request
description: Describe the task you want TwinPulse to support.
body:
  - type: textarea
    id: task
    attributes:
      label: Task and current difficulty
      description: Describe what you want to accomplish and where the current flow stops helping.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Desired result
      description: Explain what the completed workflow would let you do.
    validations:
      required: true
