[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinpulse-provider"
version = "0.1.0"
description = "TwinPulse structured multimodal provider boundary"
requires-python = ">=3.12"
dependencies = ["twinpulse-core==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
